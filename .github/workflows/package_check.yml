name: Package.json Compatibility Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  module-name-check:
    name: Module Name & Path Name Verification
    runs-on: ubuntu-latest

    steps:
      # 1. ADIM (EN ÖNEMLİ): Repoyu runner sanal makinesine çekiyoruz
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 2. ADIM: package.json varlığını doğrulama
      - name: Confirm Package.json
        if: ${{ hashFiles('package.json') != '' }}
        run: echo "Package.json exists."

      # 3. ADIM: Python betiğini çalıştırma
      - name: Run Package Validation Script
        shell: bash
        run: python3 .github/workflows/scripts/validate_package_samples.py
